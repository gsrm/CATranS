[project]
name = "CATranS"
version = "0.1.0"
description = "Clinical Acute Transcriptomic Stratification"
authors = [
    { name = "Patricia Sebastián-León", email = "patricia.sebastian@ivirma.com" },
    { name = "Antonio Parraga-Leo",     email = "antonio.parraga@ivirma.com" },
    { name = "Rubén Cañas-Cañas",       email = "ruben.canas@ivirma.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "pydeseq2>=0.5.4",
    "matplotlib>=3.10.8",
    "igraph>=1.0.0",
    "inmoose>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
