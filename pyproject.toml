[project]
name = "CATranS"
version = "0.1.0"
description = "Clinical Acute Transcriptomic Stratification"
authors = [
    { name = "Patricia Sebastián-León", email = "patricia.sebastian@ivirma.com" },
    { name = "Antonio Parraga-Leo",     email = "antonio.parraga@ivirma.com" },
    { name = "Rubén Cañas-Cañas",       email = "ruben.canas@ivirma.com" }
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bioinformatics", "machine-learning", "deseq2", "stratification", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "pydeseq2>=0.5.4",
    "igraph>=1.0.0",
    "inmoose>=0.9.1",
]

[project.urls]
Homepage = "https://github.com/gsrm/CATranS"
Issues = "https://github.com/gsrm/CATranS/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "mypy>=2.0.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "pydeseq2.*",
    "igraph.*",
    "inmoose.*",
    "statsmodels.*",
    "scipy.*",
    "pandas.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=catrans --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/catrans"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]